  # ---- Upload-needed works (not reachable on GitHub) ----
  # Provide the source files (JSON/EPUB/PDF), ingest locally, then publish a
  # bundle. These carry no `build.source` because they cannot be auto-fetched.
  - id: bihar-al-anwar
    tier: hadith
    expected_docs: null
    output: data/knowledge/hadith/bihar-al-anwar-*.jsonl
    build: {source: upload, adapter: tbd}
    note: "Bihar al-Anwar (101 vols). Not on GitHub; upload source files (hubeali PDF/EPUB) to ingest."
