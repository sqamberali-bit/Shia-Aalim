  - id: al-amali
    tier: hadith
    expected_docs: 1469
    output: data/knowledge/hadith/al-amali-*.jsonl
    build: {source: thaqalayn-data, adapter: thaqalayn}
  - id: uyun-akhbar-al-rida
    tier: hadith
    expected_docs: 954
    output: data/knowledge/hadith/uyun-akhbar-al-rida.jsonl
    build: {source: thaqalayn-data, adapter: thaqalayn}
  - id: al-tawhid-saduq
    tier: hadith
    expected_docs: 575
    output: data/knowledge/hadith/al-tawhid-saduq.jsonl
    build: {source: thaqalayn-data, adapter: thaqalayn}

  # ---- Prose (translations / secondary works, medium confidence) ----
  - id: al-mizan
    tier: prose
    expected_docs: 1837
    output: data/knowledge/prose/al-mizan-v*.jsonl
    build: {source: shiavault, adapter: shiavault}
