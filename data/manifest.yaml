# -----------------------------------------------------------------------------
# Corpus manifest — the source of truth for the (external) knowledge base.
#
# The built corpus (data/knowledge/**/*.jsonl) is DERIVED data and is NOT stored
# in git (see docs/data-management.md). This manifest records what the corpus
# contains, where each work comes from, and how to reconstruct it:
#
#   * rebuild from GitHub sources:  python scripts/ingest.py  (see per-work `build`)
#   * fetch a prebuilt bundle:      python scripts/fetch_data.py --from-bundle <url|path>
#   * check what you have locally:   python scripts/fetch_data.py --status
#
# `expected_docs` lets --status flag drift. The `bundle` block is filled in when
# a corpus snapshot is published (e.g. as a GitHub Release asset).
# -----------------------------------------------------------------------------

version: 1
total_expected_docs: 122918

# A published snapshot of the full built corpus. Leave url/sha256 null until a
# bundle is produced with `scripts/fetch_data.py --make-bundle` and hosted.
bundle:
  url: null
  sha256: null
  size_bytes: null
  format: "tar.gz of data/knowledge/ (excluding sample/)"

# Reachable ingestion sources (GitHub only in the hosted environment).
sources:
  quran-api:
    repo: https://github.com/fawazahmed0/quran-api
    license: open dataset
  thaqalayn-data:
    repo: https://github.com/narmafraz/ThaqalaynData
    license: CC0-1.0
  shiavault:
    repo: https://github.com/shiavault/shiavault-library
    license: per-book (al-islam.org mirror)

works:
  # ---- Qur'an ----
  - id: quran
    tier: quran
    expected_docs: 6236
    output: data/knowledge/quran/quran.jsonl
    build: {source: quran-api, adapter: quran}
    note: "Uthmani Arabic + English (Ali Quli Qarai) + Urdu (Syed Zeeshan Haider
      Jawadi, via tanzil.net). Each verse carries Arabic + English + Urdu."

