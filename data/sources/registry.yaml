    confidence: medium
    notes: "Major 20th-c. Twelver tafsir. Complete 40-volume English edition (Tawheed Institute Australia) ingested from OCR'd plain text; cited by volume + section. It is a TRANSLATION with OCR noise removed (not filled in) — medium confidence; verify wording against the Arabic original. The work itself is highly authoritative; the confidence cap reflects the translation/OCR pipeline, not the tafsir."

