    notes: "Provenance/tooling source for ingested hadith. Each narration carries its own translation (e.g. Hubeali) and rijal gradings (e.g. Majlisi's Mir'at al-'Uqul, Behbudi's Sahih al-Kafi), which are preserved verbatim. Citations still resolve to the underlying collection (e.g. al-kafi), not to this entry."

