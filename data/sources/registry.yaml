# -----------------------------------------------------------------------------
# Authoritative source registry for Shia-Aalim.
#
# This file lists the *bibliographic* sources the system is permitted to cite.
# Every `citation.source_id` in the knowledge base MUST resolve to an `id` here;
# the grounding layer rejects citations to unregistered sources (guards against
# invented books).
#
# `confidence` here reflects the standing of the WORK within the Twelver
# tradition and is a ceiling — an individual narration inside a highly-regarded
# collection may still be graded weak (da'if) at the citation level. Assign it
# via docs/source-validation-framework.md, not ad hoc.
#
# The entries below are bibliographic facts (title/author/kind). Access URLs and
# licensing are drawn from docs/landscape-existing-solutions.md (verified
# 2026-07). Text CONTENT is NOT stored here — it is ingested separately with
# per-passage citations.
# -----------------------------------------------------------------------------

sources:
  # ---- Qur'an ----
  - id: quran
    title: "The Holy Qur'an"
    kind: quran
    author: null
    language: ar
    url: "https://tanzil.net/"
    license: "Text: public; Tanzil distribution requires attribution + backlink"
    confidence: high
    notes: "Canonical text. Ingest verbatim from Tanzil (Uthmani) for exact orthography."

  - id: quran-qarai
    title: "Qur'an — English translation (Ali Quli Qarai)"
    kind: quran
    translator: "Ali Quli Qarai"
    language: en
    url: "https://raw.githubusercontent.com/fawazahmed0/quran-api/1/editions/eng-aliquliqarai.min.json"
    license: "Open dataset (fawazahmed0/quran-api)"
    confidence: high
    notes: "Phrase-by-phrase modern translation widely respected in Twelver scholarship. This is the translation currently ingested (data/knowledge/quran/quran.jsonl), paired with the canonical Uthmani Arabic."

  - id: tanzil-shakir
    title: "Qur'an — English translation (M. H. Shakir)"
    kind: quran
    translator: "Mohammedali Habib Shakir"
    language: en
    url: "https://tanzil.net/trans/"
    license: "Distributed by Tanzil; attribution required"
    confidence: high
    notes: "Alternative English rendering; verify wording against the Tanzil canonical file."

  - id: thaqalayn-data
    title: "ThaqalaynData — structured Twelver hadith corpus (data behind thaqalayn.net)"
    kind: hadith
    author: "narmafraz (compiler); translations & gradings as attributed per hadith"
    language: ar
    url: "https://github.com/narmafraz/ThaqalaynData"
    license: "CC0 1.0 Universal (public domain)"
    confidence: high
    notes: "Provenance/tooling source for ingested hadith. Each narration carries its own translation (e.g. Hubeali) and rijal gradings (e.g. Majlisi's Mir'at al-'Uqul, Behbudi's Sahih al-Kafi), which are preserved verbatim. Citations still resolve to the underlying collection (e.g. al-kafi), not to this entry."

