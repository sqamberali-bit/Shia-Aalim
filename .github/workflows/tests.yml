name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest PyYAML
      - name: Run test suite (integrity guarantees)
        run: python -m pytest -q
      - name: Smoke-test the pipeline (no installs beyond stdlib+yaml)
        run: |
          python scripts/demo.py "purification of the Ahl al-Bayt"
          python scripts/run_research_loop.py --iterations 1
